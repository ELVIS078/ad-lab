title: Office Application Spawning Command Shell
id: 7a9b1c3e-4f2d-4a6b-9e1c-3d8f7b2a5c01
status: experimental
description: |
    Detects a Microsoft Office application (Word, Excel, PowerPoint, Outlook)
    spawning cmd.exe or powershell.exe as a child process — the classic
    signature of a malicious macro executing its payload (T1566.001).
references:
    - https://attack.mitre.org/techniques/T1566/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1566.001/T1566.001.md
author: APT-Simulation-Lab
date: 2026-10-25
tags:
    - attack.initial-access
    - attack.t1566.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\OUTLOOK.EXE'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate add-ins or document automation that intentionally shells out
      (rare in most environments — should be allowlisted by hash/path, not
      by disabling this rule)
level: high
